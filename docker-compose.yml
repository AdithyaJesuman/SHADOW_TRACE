# ============================================================
# Docker Compose for SHADOW TRACE - Cloud-Ready
# Only FastAPI backend service locally
# PostgreSQL, Neo4j, Kafka, Redis configured via .env (cloud)
# ============================================================

version: '3.8'

services:
  # ============================================================
  # SHADOW TRACE FastAPI Backend
  # ============================================================
  shadow-trace-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shadow-trace-api
    environment:
      # Cloud PostgreSQL (Supabase)
      DATABASE_URL: ${DATABASE_URL}
      
      # Cloud Neo4j (Aura)
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Cloud Kafka (Confluent Cloud / AWS MSK)
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-PLAIN}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
      
      # Cloud Redis (Upstash)
      REDIS_URL: ${REDIS_URL}
      
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - shadow-trace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================
# Named Networks
# ============================================================
networks:
  shadow-trace:
    driver: bridge
